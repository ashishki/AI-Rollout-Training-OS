name: CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    name: Tests + Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: pgvector/pgvector:pg16@sha256:00ba258a66dac104fd5171074a0084462a64a1369d8513f3d0a634e2f24d15bc
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/permission_game/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -e .

      - name: Install and verify permission game
        working-directory: frontend/permission_game
        run: |
          npm ci
          npm audit --audit-level=high
          npm run lint
          npm test
          npm run build

      - name: Lint
        run: ruff check scripts ai_rollout_os frontend tests migrations

      - name: Format check
        run: ruff format --check scripts ai_rollout_os frontend tests migrations

      - name: Run tests
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://testuser:testpassword@localhost:5432/testdb
          SECRET_KEY: test-secret-key
          AI_PROVIDER_API_KEY: test-key
          MODEL_FAST: test-fast-model
          MODEL_STRONG: test-strong-model
          EMBEDDING_MODEL: test-embedding-model
          INDEX_MAX_AGE_DAYS: "7"
          FEEDBACK_TIMEOUT_SECONDS: "60"
          RETENTION_DAYS: "365"
        run: python -m pytest tests/ -q --tb=short

      - name: Retrieval evaluation
        if: hashFiles('tests/eval/test_retrieval_eval.py') != ''
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://testuser:testpassword@localhost:5432/testdb
          SECRET_KEY: test-secret-key
          AI_PROVIDER_API_KEY: test-key
          MODEL_FAST: test-fast-model
          MODEL_STRONG: test-strong-model
          EMBEDDING_MODEL: test-embedding-model
        run: python -m pytest tests/eval/test_retrieval_eval.py -q --tb=short

      - name: Retrieval eval script
        if: hashFiles('scripts/eval.py') != ''
        env:
          APP_ENV: test
          DATABASE_URL: postgresql+psycopg://testuser:testpassword@localhost:5432/testdb
          SECRET_KEY: test-secret-key
          AI_PROVIDER_API_KEY: test-key
          MODEL_FAST: test-fast-model
          MODEL_STRONG: test-strong-model
          EMBEDDING_MODEL: test-embedding-model
        run: python scripts/eval.py --no-write
